name: Nihonga news daily crawl

on:
  schedule:
    # 02:15 Asia/Tokyo (17:15 UTC). GitHub may delay scheduled jobs slightly.
    - cron: "15 17 * * *"
  workflow_dispatch:

concurrency:
  group: nihonga-news-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check -r news/requirements.txt
      - name: Check required configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$SUPABASE_URL" && echo "SUPABASE_URL: provided" || { echo "SUPABASE_URL: missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" && echo "SUPABASE_SERVICE_ROLE_KEY: provided" || { echo "SUPABASE_SERVICE_ROLE_KEY: missing"; exit 1; }
          test -n "$OPENAI_API_KEY" && echo "OPENAI_API_KEY: provided" || { echo "OPENAI_API_KEY: missing"; exit 1; }
      - name: Crawl, enrich and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The Python processor uses Chat Completions; accept a provider root
          # secret (for example https://cn-api.ooapi.cc) and add the path.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_WIRE_API: ${{ secrets.OPENAI_WIRE_API }}
        run: |
          base="$OPENAI_BASE_URL"
          case "$base" in
            */chat/completions) ;;
            */v1) base="${base%/}/chat/completions" ;;
            *) base="${base%/}/v1/chat/completions" ;;
          esac
          echo "OPENAI_BASE_URL=$base" >> "$GITHUB_ENV"
          python scripts/news_crawler.py \
            --process-ai \
            --write \
            --refresh \
            --out /tmp/news-candidates.json \
            --state-file /tmp/news-crawler-state.json \
            --log-file /tmp/news-crawler.log
      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-crawl-${{ github.run_number }}
          path: |
            /tmp/news-candidates.json
            /tmp/news-crawler.log
          if-no-files-found: ignore
